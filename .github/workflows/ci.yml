name: CI

on:
  push:
    branches: [main]
  pull_request:

# Everything here runs offline: the built-in scenarios replay recorded model output and payments use the
# labelled simulator, so no secrets are needed. The private jobs start their own throwaway PostgreSQL, Keycloak
# and mail sink with randomly generated local credentials; they never contact a model or PayPal.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The deployable release must build and must not contain local secrets or data.
      - run: npm run package
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run infra:init
      - run: docker compose --env-file .env.local-infra up -d --wait postgres
      - run: npm run db:migrate
      # Storage, marketplace, import, backup/restore and rotation suites, in a recreated isolated database.
      - run: npm run test:database
      - if: always()
        run: docker compose --env-file .env.local-infra down -v

  private-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run infra:init
      - run: docker compose --env-file .env.local-infra up -d --wait
      - name: Wait for the identity provider
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8081/realms/licensegraph >/dev/null && exit 0; sleep 3; done
          echo "Identity provider did not become ready" >&2; exit 1
      - run: npm run db:migrate
      - run: npm run identity:setup
      - run: npm run identity:fixtures
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:marketplace-browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-traces
          path: test-results
          retention-days: 7
      - if: always()
        run: docker compose --env-file .env.local-infra down -v
