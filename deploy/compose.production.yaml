# The lean server stack: one PostgreSQL server (application and identity databases) and Keycloak.
# Total memory budget about 420 MB; every service has a hard limit so it cannot take a neighbour's memory.
# Run:  docker compose --env-file /opt/licensegraph/stack.env -f deploy/compose.production.yaml up -d
# stack.env needs: DATABASE_PASSWORD, IDENTITY_DATABASE_PASSWORD, IDENTITY_ADMIN_PASSWORD, IDENTITY_PUBLIC_URL
# (the address users reach Keycloak at, for example https://id.example.com).
# If this machine already runs PostgreSQL 16+ natively, skip the "postgres" service: create the two databases there
# and point DATABASE_URL and KC_DB_URL at it (docs/LEAN-DEPLOY.md).
name: licensegraph
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=50", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=128MB", "-c", "wal_buffers=2MB", "-c", "max_wal_size=256MB"]
    mem_limit: 192m
    environment:
      POSTGRES_DB: licensegraph
      POSTGRES_USER: licensegraph
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?Set IDENTITY_DATABASE_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - database:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-identity.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licensegraph -d licensegraph"]
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    # Production mode: no development caches or theme reloading. TLS ends at the reverse proxy in front.
    command: ["start", "--import-realm", "--http-enabled=true", "--proxy-headers=xforwarded"]
    mem_limit: 480m
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: administrator
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Set IDENTITY_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DATABASE_PASSWORD}
      KC_HOSTNAME: ${IDENTITY_PUBLIC_URL:?Set IDENTITY_PUBLIC_URL}
      KC_HTTP_PORT: 8080
      KC_CACHE: local
      KC_HEALTH_ENABLED: "false"
      KC_METRICS_ENABLED: "false"
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m"
      JAVA_OPTS_APPEND: "-XX:TieredStopAtLevel=1"
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["../infra/keycloak:/opt/keycloak/data/import:ro"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  database:
